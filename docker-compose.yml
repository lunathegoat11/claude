# Local production-like stack: PostgreSQL + the app.
#   docker compose up --build
#   docker compose run --rm app node node_modules/prisma/build/index.js db seed   (optional; see README)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kosha
      POSTGRES_PASSWORD: kosha
      POSTGRES_DB: kosha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosha"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kosha:kosha@db:5432/kosha?schema=public
      APP_URL: http://localhost:3000
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET (openssl rand -base64 48)}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_LOGIN_ENABLED: "false"
    volumes:
      - uploads:/app/storage
volumes:
  pgdata:
  uploads:
