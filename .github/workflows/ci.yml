name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kosha
          POSTGRES_PASSWORD: kosha
          POSTGRES_DB: kosha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kosha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kosha:kosha@localhost:5432/kosha_test?schema=public
      TEST_DATABASE_URL: postgresql://kosha:kosha@localhost:5432/kosha_test?schema=public
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
